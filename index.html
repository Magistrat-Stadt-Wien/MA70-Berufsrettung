<!DOCTYPE html>
<html lang="de-AT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Berufsrettung RP</title>
<style>
:root{--red:#e2001a;--red-dk:#b4000f;--ink:#1a1a1a;--bg:#eceef0;--line:#d7dade;--gold:#c9a24b;--card:#fff;--hd1:#fff;--hd2:#f5f5f5;--sub:#5a5a5a;--inb:#9a9a9a;--rt:#b4000f;color-scheme:light}
:root[data-theme=dark]{--ink:#e8e8e8;--bg:#121315;--line:#3a3d42;--card:#1d1f23;--hd1:#25272b;--hd2:#1d1f23;--sub:#a5a9ae;--inb:#6b7076;--rt:#ff6b78;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#e8e8e8;--bg:#121315;--line:#3a3d42;--card:#1d1f23;--hd1:#25272b;--hd2:#1d1f23;--sub:#a5a9ae;--inb:#6b7076;--rt:#ff6b78;color-scheme:dark}}
@media print{:root{--card:#fff!important;--ink:#1a1a1a!important;--bg:#fff!important;--line:#d7dade!important;--sub:#5a5a5a!important;--inb:#9a9a9a!important;--rt:#b4000f!important}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:16px/1.45 Arial,"Helvetica Neue",sans-serif;color:var(--ink);background:var(--bg)}
header{background:linear-gradient(180deg,var(--hd1),var(--hd2));display:flex;align-items:center;gap:16px;padding:0 20px;
  border-bottom:3px solid var(--red);box-shadow:0 1px 0 var(--red-dk)}
.crest{width:46px;height:46px;flex:none}
.htxt b{font-size:1.15rem;letter-spacing:.2px}
.htxt small{display:block;color:var(--sub);font-size:.78rem;letter-spacing:.4px}
.hband{width:6px;align-self:stretch;background:repeating-linear-gradient(45deg,var(--red) 0 8px,var(--red-dk) 8px 16px);margin-left:4px}
#who{margin-left:auto;font-size:.9rem;display:flex;gap:10px;align-items:center}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--red);padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
h2{font-size:1.1rem;margin:0 0 10px;color:var(--rt);font-weight:700}
h3{font-size:.95rem;margin:14px 0 4px;padding-bottom:3px;border-bottom:2px solid var(--gold);color:var(--ink)}
label{display:block;font-size:.85rem;font-weight:600;margin:8px 0 3px}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--inb);background:var(--card);color:var(--ink);border-radius:0}
textarea{min-height:56px;resize:vertical}
input[type=checkbox]{width:auto;margin-right:8px}
.chk{display:flex;align-items:center;font-weight:600;margin:10px 0}
button{background:var(--red);color:#fff;border:0;padding:9px 16px;cursor:pointer;font-weight:700;letter-spacing:.2px}
button:hover{background:var(--red-dk)}
button.alt{background:var(--card);color:var(--ink);border:2px solid var(--ink);padding:7px 14px}
button.alt:hover{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #1e66b0;outline-offset:1px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:none;color:var(--ink);border-bottom:4px solid transparent;padding:10px 16px}
.tabs button.on{border-bottom-color:var(--red);color:var(--rt)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));column-gap:12px}
.badge{display:inline-block;color:#fff;padding:2px 9px;font-size:.85rem;font-weight:700}
.v{border:1px solid var(--line);border-top:5px solid #999;padding:12px;background:var(--card)}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.st button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:10px solid;text-align:left}
.st button.on{background:var(--ink);color:var(--bg)}
.vrow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
#banner{background:var(--ink);color:var(--bg);padding:12px 20px;font-weight:700;border-bottom:4px solid var(--gold)}
#login{max-width:420px;margin:40px auto}
#login .crest{width:64px;height:64px;display:block;margin:0 auto 10px}
@media(max-width:640px){.vrow{grid-template-columns:repeat(4,1fr)}}
@media print{body *{visibility:hidden}#print,#print *{visibility:visible}#print{position:absolute;left:0;top:0;width:100%;border:0}}

body{padding-bottom:84px}
#radio{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:3px solid var(--red);padding:10px 20px;display:flex;gap:14px;align-items:center;justify-content:space-between;z-index:5}
#rst{font-weight:700}
#ch,#tg{width:auto;min-width:150px;margin:0}
#radio.busy #rst{color:var(--rt)}
#theme{margin-left:10px;white-space:nowrap}
#radio.tx{background:var(--red);color:#fff}
#ptt{min-width:260px;padding:14px;font-size:1.05rem;touch-action:none;user-select:none;-webkit-user-select:none}
#radio.tx #ptt{background:#fff;color:var(--red-dk)}

/* ===== Einsatzleitsystem-Design ===== */
.n144{margin-left:auto;background:var(--red);color:#fff;padding:5px 12px;font:700 .95rem var(--fc);letter-spacing:.4px;white-space:nowrap}.n144 b{font-size:1.35rem;margin-left:4px}
.n144+#clk{margin-left:14px}
footer.ft{padding:18px 20px 96px;text-align:center;color:var(--sub);font-size:.8rem}
.v.sw{animation:swb 1s steps(2,jump-none) infinite}@keyframes swb{50%{background:color-mix(in srgb,#00897b 28%,var(--card))}}
@media(prefers-reduced-motion:reduce){.v.sw{animation:none;background:color-mix(in srgb,#00897b 28%,var(--card))}}
@media(max-width:640px){.n144{display:none}}
.logo{display:block;height:66px;width:auto;background:#fff;padding:6px 10px;border-radius:2px;flex:none}
#login .logo{height:auto;width:100%;max-width:230px;margin:0 auto 14px;padding:10px 12px;border-radius:2px}
@media(max-width:640px){.logo{height:52px;padding:4px 8px}}
.dt{width:100%;border-collapse:collapse}
.dt th{text-align:left;font:700 1rem var(--fc);color:var(--sub);padding:6px 10px;border-bottom:2px solid var(--ph)}
.dt td{padding:8px 10px;border-bottom:1px solid var(--line)}
.dt tr.me td{background:color-mix(in srgb,var(--gold) 18%,transparent)}
dialog.card{color:var(--ink);max-width:460px;width:92vw;padding:16px;border-radius:0}
dialog.card::backdrop{background:rgba(0,0,0,.6)}
#radio button.alt{background:transparent;color:#fff;border:1px solid #5a616b}
#radio button.alt:hover{background:var(--red);border-color:var(--red)}
:root{--ph:#23272e;--warn:#e8e000;--fc:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--chk:conic-gradient(var(--red) 25%,#f4f4f4 0 50%,var(--red) 0 75%,#f4f4f4 0)}
:root[data-theme=dark]{--ph:#2d323a}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ph:#2d323a}}
body{font-family:Barlow,Arial,sans-serif;background-image:linear-gradient(rgba(128,128,128,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(128,128,128,.08) 1px,transparent 1px);background-size:24px 24px}
header{position:relative;background:#14171b;color:#fff;border-bottom:0;box-shadow:none;padding:10px 20px;margin-bottom:28px}
header::after{content:"";position:absolute;left:0;right:0;bottom:-14px;height:14px;background:var(--chk) 0 0/28px 14px}
.hband{display:none}
.crest{width:46px;height:46px;filter:drop-shadow(0 0 0 #000)}
.htxt b{font:700 1.7rem/1 var(--fc);letter-spacing:.4px}
.htxt small{color:#b8bcc2;font-size:.74rem;margin-top:3px}
#clk{margin-left:auto;text-align:right;line-height:1.05;padding-right:14px;border-right:1px solid #3a3f47}
#clk b{display:block;font:700 1.6rem/1 var(--fc);font-variant-numeric:tabular-nums;letter-spacing:1px}
#clk small{color:#b8bcc2;font-size:.75rem}
#who{margin-left:0;color:#fff}
header button.alt{background:transparent;color:#fff;border:1px solid #5a616b;padding:6px 12px;clip-path:none}
header button.alt:hover{background:var(--red);border-color:var(--red);color:#fff}
.card{border:1px solid var(--line);border-left:5px solid var(--red);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.card>h2:first-child{display:flex;align-items:center;margin:-16px -16px 14px;padding:9px 16px;background:var(--ph);color:#fff;font:700 1.2rem/1.2 var(--fc);letter-spacing:.4px;border-bottom:2px solid var(--gold)}
.card>h2:first-child::before{content:"";width:10px;height:10px;background:var(--red);margin-right:10px;flex:none}
h3{font-family:var(--fc);font-size:1.1rem;letter-spacing:.3px}
label{color:var(--sub);font-size:.82rem}
input,select,textarea{background:color-mix(in srgb,var(--card) 90%,var(--bg))}
input:focus,select:focus,textarea:focus{border-color:var(--red)}
button{font-family:var(--fc);font-size:1.08rem;letter-spacing:.4px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
button.alt{clip-path:none}
.tabs{border-bottom:3px solid var(--ph);gap:3px}
.tabs button{clip-path:none;background:var(--card);color:var(--sub);border:1px solid var(--line);border-bottom:0;border-top:4px solid transparent;font-size:1.15rem;padding:9px 20px}
.tabs button.on{background:var(--ph);color:#fff;border-top-color:var(--red)}
.v{border-left:1px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.v b{font:700 1.6rem/1.1 var(--fc);letter-spacing:.5px;margin-right:6px}
.badge{font:700 1rem/1.3 var(--fc);letter-spacing:.4px;padding:2px 10px}
.st button{clip-path:none;font-size:1.15rem;padding:14px 12px;border-left-width:12px}
#banner{background:var(--warn);color:#111;border-bottom:4px solid #111;font:700 1.25rem/1.3 var(--fc);letter-spacing:.3px}
#login{max-width:440px;margin:56px auto;border-left-width:1px;box-shadow:0 14px 44px rgba(0,0,0,.28)}
#login::before{content:"";display:block;height:14px;margin:-16px -16px 16px;background:var(--chk) 0 0/28px 14px}
#radio{background:#14171b;color:#fff;border-top:4px solid var(--red)}
#radio select{background:#23272e;color:#fff;border-color:#434a53}
#rst{color:#fff;font:700 1.15rem/1.2 var(--fc);letter-spacing:.3px}
#rst::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:10px;background:#2fbf71;box-shadow:0 0 9px #2fbf71}
#radio.busy #rst{color:#ff98a1}
#radio.busy #rst::before{background:#ff2b40;box-shadow:0 0 9px #ff2b40}
#radio.tx #rst::before{background:#fff;box-shadow:0 0 9px #fff}
#ptt{font-size:1.2rem;border:2px solid #ffffff55}
@media(max-width:640px){#clk small{display:none}.htxt small{display:none}}
@media print{.card>h2:first-child{background:none;color:#000;margin:0 0 10px;padding:0 0 4px;border-bottom:2px solid #000}.card>h2:first-child::before{display:none}.card{border-left-width:1px}}
/* ===== Feinschliff ===== */
:root{--r:3px;--sh:0 1px 2px rgba(15,20,30,.08),0 8px 22px rgba(15,20,30,.08)}
::selection{background:var(--red);color:#fff}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
*{scrollbar-width:thin;scrollbar-color:#8a9099 transparent}
body{font-size:16.5px;line-height:1.5;background-attachment:fixed}
#app{max-width:1180px;margin:0 auto;padding-bottom:24px}
header{background:linear-gradient(180deg,#1d2127,#0f1216);box-shadow:0 5px 16px rgba(0,0,0,.4)}
.logo{box-shadow:0 0 0 2px rgba(255,255,255,.14),0 4px 10px rgba(0,0,0,.35)}
#clk b{text-shadow:0 0 14px rgba(255,255,255,.2)}
.card{box-shadow:var(--sh);border-radius:var(--r);margin-bottom:16px}
.card>h2:first-child{background:linear-gradient(90deg,var(--ph),color-mix(in srgb,var(--ph) 80%,var(--red)))}
label{font-weight:600}
input,select,textarea{border-width:2px;border-radius:var(--r);padding:10px 12px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--red) 22%,transparent)}
button{border-radius:var(--r);transition:transform .08s,filter .15s,box-shadow .15s}
button:hover{filter:brightness(1.1)}
button:active{transform:translateY(1px)}
.tabs button{font-size:1.2rem;transition:color .15s,background .15s}
.tabs button:hover{color:var(--ink)}
.tabs button.on:hover{color:#fff}
#vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.v{border-radius:var(--r);padding:14px 16px;border-top-width:7px;background:var(--card)}
.v b{font-size:1.9rem}
.v .badge{display:inline-block;margin-top:4px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.st button{border:2px solid var(--line);border-left-width:12px;text-align:left;border-radius:var(--r);box-shadow:var(--sh)}
.st button.on{background:var(--ink);color:var(--bg);box-shadow:0 0 0 3px var(--gold)}
.badge{border-radius:2px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.28)}
.dt tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.dt tbody tr.me td{background:color-mix(in srgb,var(--gold) 20%,transparent)}
#login{border-radius:var(--r)}
#banner{box-shadow:0 8px 20px rgba(0,0,0,.3)}
#radio{box-shadow:0 -8px 26px rgba(0,0,0,.4)}
#radio select{border-radius:var(--r)}
#ptt{clip-path:none;border-radius:40px;padding:12px 34px}
#radio.tx #ptt{animation:ring 1.2s ease-out infinite}
@keyframes ring{from{box-shadow:0 0 0 0 rgba(255,255,255,.65)}to{box-shadow:0 0 0 16px rgba(255,255,255,0)}}
@media(prefers-reduced-motion:reduce){#radio.tx #ptt{animation:none}}
/* ===== Funkgerät ===== */
#radio{padding:14px 24px;gap:18px;align-items:stretch;justify-content:flex-start;border-top:4px solid var(--red);background:linear-gradient(180deg,#1d2127,#0d1014)}
#radio::before{content:"";position:absolute;left:0;right:0;top:-14px;height:10px;background:var(--chk) 0 0/20px 10px}
.rg{display:flex;flex-direction:column;justify-content:center;gap:5px;min-width:190px}
.rl{font:700 .85rem var(--fc);letter-spacing:.5px;color:#8d949d}
.rg select{width:100%}
#rdisp{flex:1;min-width:0;display:flex;align-items:center;padding:8px 18px;background:#08140d;border:2px solid #2b4231;border-radius:4px;box-shadow:inset 0 0 22px rgba(0,0,0,.75)}
#rst{color:#7dffa8;font:600 1.3rem/1.25 var(--fc);letter-spacing:.4px;text-shadow:0 0 9px rgba(125,255,168,.55)}
#rst::before{width:14px;height:14px}
#radio.busy #rdisp{background:#1a0a0a;border-color:#5a2424}
#radio.busy #rst{color:#ff9a9a;text-shadow:0 0 9px rgba(255,90,90,.55)}
#radio.tx{background:linear-gradient(180deg,#c40018,#6e000c)}
#radio.tx #rdisp{background:#2a0006;border-color:#ff7b8a}
#radio.tx #rst{color:#fff;text-shadow:0 0 10px rgba(255,255,255,.6)}
#ptt{min-width:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 26px;border-radius:12px;background:linear-gradient(180deg,#f0132d,#a8000f);color:#fff;border:2px solid rgba(255,255,255,.35);box-shadow:0 4px 0 #5e0008,0 8px 16px rgba(0,0,0,.4)}
#ptt b{font:700 1.6rem/1 var(--fc);letter-spacing:.6px}
#ptt small{font:600 .85rem var(--fc);opacity:.88}
#radio.tx #ptt{background:#fff;color:var(--red-dk);transform:translateY(3px);box-shadow:0 1px 0 #999}
footer.ft{padding-bottom:130px}
@media(max-width:700px){#radio{flex-wrap:wrap;padding:10px 12px;gap:10px}#rdisp{order:-1;flex:1 1 100%}.rg{flex:1 1 40%;min-width:120px}#ptt{flex:1 1 55%;min-width:0;padding:8px 12px}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<script>
(function(){
  var h=document.documentElement,t=null;
  try{t=localStorage.getItem("theme")}catch(e){}
  if(t==="dark"||t==="light")h.setAttribute("data-theme",t);
  var eff=function(){return h.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")};
  var lab=function(b){b.textContent=eff()==="dark"?"\u2600 Hell":"\u263E Dunkel"};
  addEventListener("DOMContentLoaded",function(){
    var c=document.getElementById("clk"),tick=function(){var d=new Date();c.firstChild.textContent=d.toLocaleTimeString("de-AT");c.lastChild.textContent=d.toLocaleDateString("de-AT",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric"})};tick();setInterval(tick,1000);
    var b=document.getElementById("theme");lab(b);
    b.onclick=function(){var n=eff()==="dark"?"light":"dark";h.setAttribute("data-theme",n);try{localStorage.setItem("theme",n)}catch(e){}lab(b)};
  });
})();
</script>

/* ---------- Login ---------- */
$("#l-role").onchange = e => $("#l-call-w").hidden = e.target.value === "leit";
$("#l-go").onclick = () => {
  const role = $("#l-role").value, name = $("#l-name").value.trim(), call = $("#l-call").value.trim();
  if (!name || (role === "fzg" && !call)) { $("#l-err").textContent = "Bitte Namen" + (role === "fzg" ? " und Funkrufnamen" : "") + " eingeben."; return; }
  const typ = $("#l-typ").value;
  me = {role, name, call, typ, ch: role === "leit" ? "rtw" : typ, vid: call.toLowerCase().replace(/[^a-z0-9]+/g, "-")};
  try { sessionStorage.setItem("me", JSON.stringify(me)); } catch {}
  start();
};
try { const s = sessionStorage.getItem("me"); if (s) { me = JSON.parse(s); $("#l-name").value = me.name; } } catch {}

/* ---------- Funk ---------- */
function beep() {
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  [880, 660].forEach((f, i) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = f; g.gain.value = .15;
    o.connect(g); g.connect(actx.destination);
    o.start(actx.currentTime + i * .18); o.stop(actx.currentTime + i * .18 + .14);
  });
}
/* Kurzes Digitalfunk-Quittungssignal (Tetra-artig), beim Statuswechsel */
function tetraBeep() {
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  const t0 = actx.currentTime;
  [[1400, 0], [1800, .07], [1400, .14]].forEach(([f, off]) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "square"; o.frequency.value = f; g.gain.value = .06;
    o.connect(g); g.connect(actx.destination);
    o.start(t0 + off); o.stop(t0 + off + .05);
  });
}
function say(text) {
  beep();
  setTimeout(() => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "de-AT"; u.rate = 1.05;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }, 450);
}
function listenAnnouncements() {
  onValue(ref(db, "announcements/latest"), snap => {
    const a = snap.val();
    if (firstAnn) { firstAnn = false; lastAnn = a && a.id; return; }
    if (!a || a.id === lastAnn) return;
    lastAnn = a.id;
    if (a.target === "alle" || a.target === me.vid) {
      const b = $("#banner"); b.hidden = false;
      b.textContent = "Leitstelle: " + a.text;
      say(a.text);
    }
  });
}

/* ---------- Start ---------- */
async function start() {
  me.ch = me.ch || "rtw";
  $("#login").hidden = true; $("#app").hidden = false;
  $("#who").innerHTML = esc(me.name) + (me.role === "fzg" ? " · " + esc(me.call) : " · Leitstelle") + ' <button class="alt" id="out">Abmelden</button>';
  $("#out").onclick = async () => {
    if (me.role === "fzg") await update(ref(db, "vehicles/" + me.vid), {status: "aus"});
    sessionStorage.removeItem("me"); location.reload();
  };
  beep();
  listenAnnouncements();
  radioInit();
  me.role === "leit" ? leitstelle() : fahrzeug();
}

function archive(box,edit){
  box.innerHTML='<input id="q" placeholder="Suchen: Patient, Fahrzeug, SV-Nummer, Einsatz" aria-label="Suchen" style="margin-bottom:12px"><div id="alist"></div><div id="adet"></div>';

    const q=$("#q").value.toLowerCase();
    const rows=Object.entries(all).filter(([,p])=>[p.p_name,p.fz,p.p_svnr,p.enr].join(" ").toLowerCase().includes(q)).sort((a,b)=>b[1].ts-a[1].ts);
    $("#alist").innerHTML=rows.length?rows.map(([id,p])=>`<div class="card"><b>${esc(p.p_name||"Unbekannter Patient")}</b> · ${esc(p.fz)} · ${new Date(p.ts).toLocaleString("de-AT")}${p.enr?" · "+esc(p.enr):""}<div class="row"><button data-a="v" data-id="${id}">Ansehen</button>${edit?`<button class="alt" data-a="e" data-id="${id}">Bearbeiten</button>`:`<button class="alt" data-a="d" data-id="${id}">Löschen</button>`}</div></div>`).join(""):"<p>Keine Protokolle gefunden.</p>";
  };
  const detail=p=>{
    const h=SEC.map(([t,f,c])=>{
      if(c&&!p[c])return"";
      if(f==="vit")return p.vit&&p.vit.length?`<h3>${t}</h3>`+p.vit.map(v=>`<div>${VK.map(k=>k.toUpperCase()+": "+esc(v[k]||"–")).join(" · ")}</div>`).join(""):"";
      const l=f.filter(([k,,ty])=>p[k]&&ty!=="check").map(([k,lb])=>`<div><b>${lb}:</b> ${esc(p[k])}</div>`).join("");
      return l?`<h3>${t}</h3>${l}`:"";
    }).join("");
    $("#adet").innerHTML=`<div class="card" id="print"><h2>Patientenprotokoll</h2><div>Fahrzeug: ${esc(p.fz)} · Besatzung: ${esc(p.crew)} · Einsatz: ${esc(p.enr||"–")}</div>${h}<div class="row"><button id="pr">Drucken</button><button class="alt" id="cl">Schließen</button></div></div>`;
    $("#pr").onclick=()=>print();$("#cl").onclick=()=>$("#adet").innerHTML="";
    $("#adet").scrollIntoView();
  };
  box.onclick=e=>{const b=e.target.closest("button[data-a]");if(!b)return;const id=b.dataset.id;

    if(b.dataset.a==="e")edit(id);

/* ---------- Sprechfunk (WebRTC, Push-to-Talk, ein Sprecher gleichzeitig) ---------- */
const ICE={iceServers:[{urls:"stun:stun.l.google.com:19302"}]};
const pcs={};let C={},T=null,talk=0,seq=0,stream=null,od=null;
const PC={"Notfall – Sondersignal":"#e2001a","Dringend":"#e0a100","Planbar / Transport":"#1e66b0"};
const hm=t=>new Date(t).toLocaleTimeString("de-AT",{hour:"2-digit",minute:"2-digit"});
const CH=[["rtw","RTW"],["nef","NEF / NAW"],["ktw","KTW / NKTW"],["son1","Sonderlage 1"],["son2","Sonderlage 2"]];
let R={},lk=null,tg="";const chName=k=>(CH.find(c=>c[0]===k)||[0,k])[1];
const tref=()=>ref(db,"radio/"+(me.role==="leit"&&tg?"dm_"+tg:me.ch)+"/talker");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const myName=()=>me.role==="leit"?"Leitstelle":me.call;
const peers=()=>me.role==="leit"&&tg?(C[tg]?[tg]:[]):Object.keys(C).filter(k=>k!==me.cid&&(C[k].leit||C[k].ch===me.ch));
const gather=pc=>new Promise(r=>{if(pc.iceGatheringState==="complete")return r();
  pc.addEventListener("icegatheringstatechange",()=>pc.iceGatheringState==="complete"&&r());setTimeout(r,2000)});
const freeLock=()=>runTransaction(lk||tref(),c=>c&&c.cid===me.cid?null:c);
function ui(){
  const mine=T&&T.cid===me.cid,r=$("#radio");
  r.classList.toggle("tx",!!(talk||mine));r.classList.toggle("busy",!!T&&!mine);
  const oth=me.role==="leit"?Object.entries(R).filter(([k,v])=>(tg||k!==me.ch)&&v&&v.talker&&CH.some(c=>c[0]===k)).map(([k,v])=>chName(k)+": "+v.talker.name):[];
  $("#rst").textContent=(talk&&!mine?"Verbindung wird aufgebaut …":mine?(tg?"Einzelruf an "+((C[tg]||{}).name||"")+" – nur dieses Fahrzeug hört dich":"Du sprichst – Kanal offen"):T?"Es spricht: "+T.name:"Funkkanal frei")+(oth.length?" · Auf anderen Kanälen – "+oth.join(", "):"");
  $("#ch").disabled=$("#tg").disabled=!!(talk||mine);
}
async function pttDown(){
  if(talk)return;const id=++seq;talk=id;ui();
  try{stream=stream||await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
  catch{talk=0;ui();alert("Mikrofon nicht verfügbar. Bitte Zugriff erlauben (Schloss-Symbol in der Adresszeile).");return}
  if(talk!==id)return;
  lk=tref();const r=await runTransaction(lk,c=>(!c||c.cid===me.cid||Date.now()-c.ts>60000)?{cid:me.cid,name:myName(),ts:Date.now()}:undefined);
  if(!r.committed){talk=0;ui();return}
  if(talk!==id){await freeLock();return}
  od=onDisconnect(lk);od.remove();
  stream.getAudioTracks().forEach(t=>t.enabled=true);
  let ready=false;const ok=()=>{if(!ready&&talk===id){ready=true;tetraBeep()}};
  const ps=peers();if(!ps.length)ok();
  setTimeout(ok,3000);
  await Promise.all(ps.map(async k=>{try{
    const pc=new RTCPeerConnection(ICE);pcs["out"+k]=pc;
    stream.getTracks().forEach(t=>pc.addTrack(t,stream));
    pc.onconnectionstatechange=()=>pc.connectionState==="connected"&&ok();
    await pc.setLocalDescription(await pc.createOffer());await gather(pc);
    if(talk!==id)return;
    await set(ref(db,`sig/${k}/${me.cid}`),{type:"offer",sdp:pc.localDescription.sdp});
  }catch(e){console.warn(e)}}));
}
async function pttUp(){
  if(!talk)return;talk=0;ui();
  stream&&stream.getAudioTracks().forEach(t=>t.enabled=false);
  tetraBeep();await sleep(400);
  Object.keys(pcs).filter(k=>k.startsWith("out")).forEach(k=>{pcs[k].close();delete pcs[k];set(ref(db,`sig/${k.slice(3)}/${me.cid}`),null)});
  set(ref(db,"ans/"+me.cid),null);
  if(od){od.cancel();od=null}
  await freeLock();
}
function radioInit(){
  me.cid="c"+Math.random().toString(36).slice(2,10);
  const cref=ref(db,"clients/"+me.cid);
  set(cref,{name:myName(),ch:me.ch,leit:me.role==="leit",typ:me.typ||null});onDisconnect(cref).remove();
  $("#radio").hidden=false;
  onValue(ref(db,"clients"),s=>{C=s.val()||{};if(typeof fillTg==="function"&&!talk)fillTg()});
  let prev=null;
  const sel=$("#ch");sel.innerHTML=CH.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join("");sel.value=me.ch;
  const upd=()=>{const k=me.role==="leit"&&tg?"dm_"+tg:me.ch;T=(R[k]||{}).talker||null;
    if(me.role!=="leit"&&!T){const d=(R["dm_"+me.cid]||{}).talker;if(d)T={...d,name:d.name+" (Einzelruf)"}}};
  const tgs=$("#tg");tgs.hidden=me.role!=="leit";
  const fillTg=()=>{if(me.role!=="leit")return;if(tg&&!C[tg])tg="";
    tgs.innerHTML='<option value="">Anruf: alle auf Kanal</option>'+Object.entries(C).filter(([k,v])=>!v.leit).map(([k,v])=>`<option value="${k}">Einzelruf: ${esc(v.name)}</option>`).join("");tgs.value=tg};
  tgs.onchange=()=>{tg=tgs.value;upd();prev=T;ui()};
  sel.onchange=()=>{me.ch=sel.value;try{sessionStorage.setItem("me",JSON.stringify(me))}catch{}update(cref,{ch:me.ch});upd();prev=T;ui()};
  onValue(ref(db,"radio"),s=>{R=s.val()||{};upd();if(prev&&!T&&prev.cid!==me.cid)tetraBeep();prev=T;ui()});
  onValue(ref(db,"sig/"+me.cid),async s=>{
    const all=s.val()||{};
    for(const [from,o] of Object.entries(all)){
      if(pcs["in"+from]||o.type!=="offer")continue;
      const pc=new RTCPeerConnection(ICE);pcs["in"+from]=pc;
      pc.ontrack=e=>{let a=document.getElementById("rx"+from);if(!a){a=document.createElement("audio");a.id="rx"+from;a.autoplay=true;document.body.appendChild(a)}a.srcObject=e.streams[0];a.play().catch(()=>{})};
      try{
        await pc.setRemoteDescription({type:"offer",sdp:o.sdp});
        await pc.setLocalDescription(await pc.createAnswer());await gather(pc);
        await set(ref(db,`ans/${from}/${me.cid}`),{sdp:pc.localDescription.sdp});
      }catch(e){console.warn(e)}
    }
    Object.keys(pcs).forEach(k=>{if(k.startsWith("in")&&!all[k.slice(2)]){pcs[k].close();delete pcs[k];const a=document.getElementById("rx"+k.slice(2));a&&a.remove()}});
  });
  onValue(ref(db,"ans/"+me.cid),async s=>{
    for(const [from,o] of Object.entries(s.val()||{})){
      const pc=pcs["out"+from];
      if(pc&&pc.signalingState==="have-local-offer")await pc.setRemoteDescription({type:"answer",sdp:o.sdp}).catch(()=>{});
    }
  });
  const b=$("#ptt");
  b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);pttDown()};
  b.onpointerup=b.onpointercancel=pttUp;
  b.oncontextmenu=e=>e.preventDefault();
  addEventListener("keydown",e=>{if(e.code==="F1"){e.preventDefault();if(!e.repeat)pttDown()}});
  addEventListener("keyup",e=>{if(e.code==="F1"){e.preventDefault();pttUp()}});
}


if(me&&me.role)start();
</script>
